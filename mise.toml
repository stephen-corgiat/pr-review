[tools]
go = "1.27"

[tasks.install]
description = "Build pr-review and install it into $(go env GOPATH)/bin"
run = "go install ."

[tasks.test]
description = "go vet and the full test suite (the UI scenarios take about 6 minutes)"
run = ["go vet ./...", "go test ./..."]

[tasks.demo-gif]
description = "Re-render docs/media/demo.gif from demo/review.tape (replays demo/recording; see demo/README.md)"
tools = { vhs = "0.12.1", ttyd = "latest" }
run = "demo/render.sh"

[tasks.demo-gif-handoff]
description = "Re-render docs/media/handoff.gif from demo/handoff.tape (runs a live Claude Code session; see demo/README.md)"
tools = { vhs = "0.12.1", ttyd = "latest" }
run = "demo/render.sh handoff"
